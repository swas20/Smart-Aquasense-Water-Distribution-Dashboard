<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AquaSense Distribution Hybrid</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{--bg:#070b14;--panel:#101828;--card:#121d33;--border:#1e2f52;--accent:#00e5b0;--blue:#3b82f6;--red:#ef4444;--yellow:#f59e0b;--text:#e6edf7;--muted:#7b8ba5}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:monospace;min-height:100vh}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-weight:800;color:var(--accent);letter-spacing:1px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--red)}.dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.cfg{display:flex;gap:6px} .cfg input{background:var(--bg);border:1px solid var(--border);color:#fff;padding:6px 10px;border-radius:7px;font-size:0.7rem;width:170px}
.cfg button{background:var(--blue);color:#fff;border:none;padding:6px 12px;border-radius:7px;font-weight:800;cursor:pointer}
/* TOP SECTION - Monitor left, Diff right */
.top-row{display:grid;grid-template-columns:380px 1fr;gap:14px;padding:14px;max-width:1400px;margin:auto}
@media(max-width:900px){.top-row{grid-template-columns:1fr}}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{background:linear-gradient(180deg,var(--card),var(--panel));border:1px solid var(--border);border-radius:12px;padding:14px}
.sum-label{font-size:0.55rem;color:var(--muted);letter-spacing:1px}.sum-val{font-size:1.7rem;font-weight:800;margin-top:4px}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card.monitor{border:1.5px solid var(--blue);box-shadow:0 0 20px rgba(59,130,246,.15)}
.head{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700}
.flow{padding:16px;text-align:center}.flow-v{font-size:2.6rem;font-weight:800;color:var(--accent)}
.badge{padding:4px 10px;border-radius:20px;font-size:0.65rem;font-weight:800}.open{background:rgba(0,229,176,.12);color:var(--accent);border:1px solid var(--accent)}.closed{background:rgba(239,68,68,.12);color:var(--red);border:1px solid var(--red)}
.ctrl{display:flex;gap:8px;padding:10px}.btn{flex:1;padding:10px;border-radius:8px;border:none;font-weight:800;cursor:pointer}.btn-o{background:var(--accent);color:#000}.btn-c{background:transparent;color:var(--red);border:1px solid var(--red)}
.paybox{padding:10px;background:rgba(0,229,176,.05);border-top:1px solid var(--border)}.pay-row{display:flex;gap:6px;margin-top:8px}.pay-input{flex:1;padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:#fff}
.pay-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:800;cursor:pointer}
.customers{padding:0 14px 40px;max-width:1400px;margin:auto}
.cust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:14px}
.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}
/* LOGIN */
#login{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:360px}
.login-box h2{color:var(--accent);margin-bottom:18px;text-align:center}
.login-box label{font-size:0.7rem;color:var(--muted);display:block;margin:10px 0 4px}
.login-box input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:#fff}
.pass-wrap{position:relative;display:flex;align-items:center}
.pass-wrap input{padding-right:40px}
.eye{position:absolute;right:10px;cursor:pointer;user-select:none}
.login-btn{width:100%;margin-top:18px;padding:12px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:800;cursor:pointer}
#loginErr{color:var(--red);font-size:0.7rem;margin-top:8px;text-align:center;display:none}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:0.8rem;display:none;z-index:99}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login">
  <div class="login-box">
    <h2>AQUASENSE LOGIN</h2>
    <label>Account Name</label>
    <input id="accName" type="text" placeholder="aquasense"/>
    <label>Password</label>
    <div class="pass-wrap">
      <input id="accPass" type="password" placeholder="distribution2026"/>
      <span class="eye" onclick="togglePass()">👁️</span>
    </div>
    <button class="login-btn" onclick="doLogin()">LOGIN</button>
    <div id="loginErr">Wrong account or password</div>
  </div>
</div>

<header>
  <div style="display:flex;gap:12px;align-items:center">
    <div class="logo">AQUASENSE</div>
    <div style="font-size:0.65rem;display:flex;gap:8px"><span><span id="dotLocal" class="dot"></span> LOCAL</span><span><span id="dotCloud" class="dot"></span> CLOUD</span></div>
  </div>
  <div class="cfg">
    <input id="localIp" placeholder="http://192.168.x.x"/>
    <input id="mqttTopic" value="aquasense/moses_kaaga_9x7p2"/>
    <button onclick="saveAndConnect()">CONNECT</button>
  </div>
</header>

<div class="top-row">
  <!-- MONITOR LEFT -->
  <div id="monitorWrap"><div class="empty">Waiting for monitor</div></div>
  <!-- DIFFERENTIAL RIGHT -->
  <div class="diff-grid">
    <div class="sum"><div class="sum-label">MONITOR TOTAL ID 0</div><div class="sum-val" style="color:var(--blue)" id="mon">0 L</div></div>
    <div class="sum"><div class="sum-label">CUSTOMERS TOTAL</div><div class="sum-val" style="color:var(--accent)" id="cust">0 L</div></div>
    <div class="sum"><div class="sum-label">DIFFERENCE LOSS</div><div class="sum-val" style="color:var(--red)" id="diff">0 L</div></div>
    <div class="sum"><div class="sum-label">% LOSS LEAK/THEFT</div><div class="sum-val" style="color:var(--yellow)" id="perc">0%</div></div>
  </div>
</div>

<div class="customers">
  <div style="font-size:0.7rem;color:var(--muted);letter-spacing:1px">CUSTOMER NODES</div>
  <div class="cust-grid" id="custGrid"><div class="empty" style="grid-column:1/-1">Waiting for node</div></div>
</div>

<div id="toast"></div>

<script>
const ACC_NAME="aquasense";
const ACC_NAME_SHORT="aquasense";
const ACC_PASS="distribution2026";

}

function togglePass(){
  let p=document.getElementById('accPass');
  p.type = p.type==='password' ? 'text' : 'password';
}
function doLogin(){
  let u=document.getElementById('accName').value.trim();
  let pw=document.getElementById('accPass').value.trim();
  if(u===ACC_NAME && pw===ACC_PASS){
    document.getElementById('login').style.display='none';
    localStorage.setItem('aqua_auth','1');
  }else{
    document.getElementById('loginErr').style.display='block';
  }
}
if(localStorage.getItem('aqua_auth')==='1'){document.getElementById('login').style.display='none';}

let LOCAL_BASE=localStorage.getItem('AQUA_LOCAL')||'';
let TOPIC_BASE=localStorage.getItem('AQUA_TOPIC')||'aquasense/moses_kaaga_9x7p2';
let mqttClient=null, localTimer=null;
document.getElementById('localIp').value=LOCAL_BASE;
document.getElementById('mqttTopic').value=TOPIC_BASE;

function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}

function cardHTML(id,isMon){
  let pay=isMon?'':`<div class="paybox"><div style="font-size:0.7rem">Paid <b id="paid-${id}">0</b> | Rem <b id="rem-${id}" style="color:var(--accent)">0</b> Ksh | Used <b id="used-${id}">0</b> Ksh</div><div class="pay-row"><input class="pay-input" id="in-${id}" type="number" placeholder="Enter Ksh"><button class="pay-btn" onclick="doPay('${id}')">PAY & OPEN</button></div></div>`;
  return `<div class="card ${isMon?'monitor':''}" id="card-${id}"><div class="head"><div>${isMon?'◈ MONITOR BULK ID 0':'◈ CUSTOMER ID '+id}</div><div style="font-size:0.6rem" id="rssi-${id}">--</div></div><div class="flow"><div class="flow-v" id="flow-${id}">0.00</div><div style="font-size:0.65rem;color:var(--muted)">TOTAL <b id="total-${id}">0</b> L | <span class="badge closed" id="valve-${id}">UNKNOWN</span></div></div><div class="ctrl"><button class="btn btn-o" onclick="doValve('${id}','open')">OPEN</button><button class="btn btn-c" onclick="doValve('${id}','close')">CLOSE</button></div>${pay}</div>`;
}
function renderData(data,source){
  if(!data||!data.nodes) return;
  if(source==='local') document.getElementById('dotLocal').classList.add('on');
  if(source==='cloud') document.getElementById('dotCloud').classList.add('on');
  if(data.summary){document.getElementById('mon').textContent=data.summary.mon+' L';document.getElementById('cust').textContent=data.summary.cust+' L';document.getElementById('diff').textContent=data.summary.diff+' L';document.getElementById('perc').textContent=data.summary.perc.toFixed(1)+' %';}
  data.nodes.forEach(n=>{
    if(n.id=='0'){
      let wrap=document.getElementById('monitorWrap');
      if(!document.getElementById('card-0')) wrap.innerHTML=cardHTML(n.id,true);
      document.getElementById('flow-0').textContent=parseFloat(n.flow).toFixed(2);
      document.getElementById('total-0').textContent=n.total;
      let vb=document.getElementById('valve-0'); vb.textContent=n.valve; vb.className='badge '+(n.valve.includes('OPEN')?'open':'closed');
      document.getElementById('rssi-0').textContent='RSSI '+n.rssi+' | '+source;
    }else{
      let grid=document.getElementById('custGrid');
      if(grid.innerHTML.includes('Waiting for node')) grid.innerHTML='';
      if(!document.getElementById('card-'+n.id)) grid.insertAdjacentHTML('beforeend',cardHTML(n.id,false));
      document.getElementById('flow-'+n.id).textContent=parseFloat(n.flow).toFixed(2);
      document.getElementById('total-'+n.id).textContent=n.total;
      let vb=document.getElementById('valve-'+n.id); vb.textContent=n.valve; vb.className='badge '+(n.valve.includes('OPEN')?'open':'closed');
      document.getElementById('rssi-'+n.id).textContent='RSSI '+n.rssi+' | '+source;
      document.getElementById('paid-'+n.id).textContent=(n.paid||0).toFixed(0);
      document.getElementById('used-'+n.id).textContent=(n.usedCost||0).toFixed(0);
      document.getElementById('rem-'+n.id).textContent=(n.remaining||0).toFixed(0);
    }
  });
}
async function pollLocal(){
  if(!LOCAL_BASE) return;
  try{let r=await fetch(LOCAL_BASE+'/data'); let d=await r.json(); renderData(d,'local');}catch(e){document.getElementById('dotLocal').classList.remove('on');}
}
function connectLocal(){ if(localTimer) clearInterval(localTimer); if(LOCAL_BASE){pollLocal(); localTimer=setInterval(pollLocal,2000);} }
function connectMQTT(){
  if(!TOPIC_BASE) return; if(mqttClient) mqttClient.end();
  mqttClient=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{clientId:'aqua_'+Math.random().toString(16).substr(2,8)});
  mqttClient.on('connect',()=>{document.getElementById('dotCloud').classList.add('on'); mqttClient.subscribe(TOPIC_BASE+'/live'); toast('Cloud Connected');});
  mqttClient.on('message',(t,m)=>{ if(t.endsWith('/live')){try{renderData(JSON.parse(m.toString()),'cloud')}catch(e){}} });
  mqttClient.on('close',()=>document.getElementById('dotCloud').classList.remove('on'));
}
function saveAndConnect(){
  LOCAL_BASE=document.getElementById('localIp').value.trim().replace(/\/$/,'');
  TOPIC_BASE=document.getElementById('mqttTopic').value.trim().replace(/\/$/,'');
  localStorage.setItem('AQUA_LOCAL',LOCAL_BASE); localStorage.setItem('AQUA_TOPIC',TOPIC_BASE);
  connectLocal(); connectMQTT();
}
async function doValve(id,action){
  if(mqttClient && mqttClient.connected) mqttClient.publish(TOPIC_BASE+'/cmd', JSON.stringify({node:id,action:action}));
  if(LOCAL_BASE) try{await fetch(`${LOCAL_BASE}/valve?node=${id}&action=${action}`,{mode:'no-cors'})}catch(e){}
  toast(id+':'+action);
}
async function doPay(id){
  let amt=document.getElementById('in-'+id).value; if(!amt) return;
  if(mqttClient && mqttClient.connected) mqttClient.publish(TOPIC_BASE+'/cmd', JSON.stringify({node:id,amount:parseFloat(amt)}));
  if(LOCAL_BASE) try{await fetch(`${LOCAL_BASE}/pay?node=${id}&amount=${amt}`,{mode:'no-cors'})}catch(e){}
  document.getElementById('in-'+id).value=''; toast('Paid '+amt+' to '+id);
}
if(LOCAL_BASE||TOPIC_BASE){connectLocal(); connectMQTT();}
</script>
</body>
</html>
