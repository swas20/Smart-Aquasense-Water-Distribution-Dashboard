<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AquaSense  Cloud</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{--bg:#070b14;--panel:#101828;--card:#121d33;--border:#1e2f52;--accent:#00e5b0;--blue:#3b82f6;--red:#ef4444;--yellow:#f59e0b;--text:#e6edf7;--muted:#7b8ba5}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:monospace;min-height:100vh}
header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{color:var(--accent);font-weight:800}.dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}.dot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:14px}
.sum{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}.sum-label{font-size:0.6rem;color:var(--muted)}.sum-val{font-size:1.6rem;font-weight:800}
.grid{padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}.card.monitor{border-color:var(--blue)}
.head{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}.badge{padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:800}.open{background:rgba(0,229,176,.15);color:var(--accent);border:1px solid var(--accent)}.closed{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red)}
.flow{padding:16px;text-align:center;font-size:2.4rem;font-weight:800;color:var(--accent)}
.ctrl{display:flex;gap:8px;padding:10px}.btn{flex:1;padding:10px;border-radius:8px;border:none;font-weight:800;cursor:pointer}.btn-o{background:var(--accent)}.btn-c{background:transparent;color:var(--red);border:1px solid var(--red)}
.paybox{padding:10px;background:rgba(0,229,176,.05);border-top:1px solid var(--border)}.pay-row{display:flex;gap:6px;margin-top:8px}input{flex:1;padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:#fff}
#log{position:fixed;bottom:10px;left:10px;font-size:0.6rem;color:var(--muted)}
</style></head><body>
<header>
  <div><span id="dot" class="dot"></span> <span class="logo">AQUASENSE MQTT - NO IP</span></div>
  <div style="display:flex;gap:8px;align-items:center">
    <input id="topic" value="aquasense/ke/2024" style="background:var(--card);border:1px solid var(--border);color:#fff;padding:6px 10px;border-radius:6px;width:180px"/>
    <button onclick="connectMQTT()" style="background:var(--blue);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-weight:800;cursor:pointer">CONNECT</button>
  </div>
</header>
<div class="summary">
<div class="sum"><div class="sum-label">MONITOR ID 0</div><div class="sum-val" style="color:var(--blue)" id="mon">0 L</div></div>
<div class="sum"><div class="sum-label">CUSTOMERS</div><div class="sum-val" style="color:var(--accent)" id="cust">0 L</div></div>
<div class="sum"><div class="sum-label">LOSS</div><div class="sum-val" style="color:var(--red)" id="diff">0 L</div></div>
<div class="sum"><div class="sum-label">% LOSS</div><div class="sum-val" style="color:var(--yellow)" id="perc">0%</div></div>
</div>
<div class="grid" id="grid"><div style="grid-column:1/-1;padding:60px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px">Waiting for MQTT data from Master...</div></div>
<div id="log">disconnected</div>

<script>
let client=null;
let BASE_TOPIC="aquasense/ke/2024";

function card(id,isMon){
  let pay = isMon?'':`<div class="paybox"><div style="font-size:0.7rem">Paid <b id="paid-${id}">0</b> | Used <b id="used-${id}">0</b> | Rem <b id="rem-${id}">0</b> Ksh</div><div class="pay-row"><input id="in-${id}" type="number" placeholder="Ksh"><button style="background:var(--blue);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-weight:800" onclick="pay('${id}')">PAY & OPEN</button></div></div>`;
  return `<div class="card ${isMon?'monitor':''}" id="card-${id}"><div class="head"><div>${isMon?'◈ MONITOR ID 0':'◈ CUSTOMER ID '+id}</div><div style="font-size:0.6rem" id="rssi-${id}">--</div></div><div class="flow" id="flow-${id}">0.00</div><div style="text-align:center;font-size:0.7rem;padding-bottom:10px">TOTAL <b id="total-${id}">0</b> L | <span class="badge closed" id="valve-${id}">UNKNOWN</span></div><div class="ctrl"><button class="btn btn-o" onclick="sendCmd('${id}','open')">OPEN</button><button class="btn btn-c" onclick="sendCmd('${id}','close')">CLOSE</button></div>${pay}</div>`;
}

function connectMQTT(){
  BASE_TOPIC=document.getElementById('topic').value.trim().replace(/\/$/,'');
  if(client) client.end();
  // Public HiveMQ WebSocket - No API key needed
  client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {clientId:'aqua_dash_'+Math.random().toString(16).substr(2,8)});

  client.on('connect', ()=>{
    document.getElementById('log').textContent='MQTT Connected to '+BASE_TOPIC;
    document.getElementById('dot').classList.add('on');
    client.subscribe(BASE_TOPIC+'/live');
    client.subscribe(BASE_TOPIC+'/status');
  });
  client.on('message', (topic, message)=>{
    if(topic.endsWith('/live')){
      let data=JSON.parse(message.toString());
      let grid=document.getElementById('grid');
      if(grid.children[0] && grid.children[0].textContent.includes('Waiting')) grid.innerHTML='';
      if(data.summary){ document.getElementById('mon').textContent=data.summary.mon+' L'; document.getElementById('cust').textContent=data.summary.cust+' L'; document.getElementById('diff').textContent=data.summary.diff+' L'; document.getElementById('perc').textContent=data.summary.perc.toFixed(1)+' %'; }
      data.nodes.forEach(n=>{ if(!document.getElementById('card-'+n.id)) grid.insertAdjacentHTML('beforeend',card(n.id,n.id=='0')); document.getElementById('flow-'+n.id).textContent=parseFloat(n.flow).toFixed(2); document.getElementById('total-'+n.id).textContent=n.total; let v=document.getElementById('valve-'+n.id); v.textContent=n.valve; v.className='badge '+(n.valve.includes('OPEN')?'open':'closed'); document.getElementById('rssi-'+n.id).textContent='RSSI '+n.rssi; if(n.id!='0'){ document.getElementById('paid-'+n.id).textContent=(n.paid||0).toFixed(0); document.getElementById('used-'+n.id).textContent=(n.usedCost||0).toFixed(0); document.getElementById('rem-'+n.id).textContent=(n.remaining||0).toFixed(0);} });
    }
  });
  client.on('error', e=>{ document.getElementById('log').textContent='Error: '+e; document.getElementById('dot').classList.remove('on'); });
}
function sendCmd(id,action){
  if(!client) return alert('Not connected');
  client.publish(BASE_TOPIC+'/cmd', JSON.stringify({node:id, action:action}));
}
function pay(id){
  let amt=document.getElementById('in-'+id).value; if(!amt) return;
  client.publish(BASE_TOPIC+'/cmd', JSON.stringify({node:id, amount:parseFloat(amt)}));
  document.getElementById('in-'+id).value='';
}
// auto connect
connectMQTT();
</script></body></html>
