<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AquaSense - Hybrid Control</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--panel:#101828;--card:#121d33;--border:#1e2f52;--accent:#00e5b0;--blue:#3b82f6;--red:#ef4444;--yellow:#f59e0b;--text:#e6edf7;--muted:#7b8ba5}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.logo{font-family:'Inter';font-weight:800;color:var(--accent);letter-spacing:1px}
.badge-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--red)}.badge-dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.cfg{display:flex;gap:6px;flex-wrap:wrap}
.cfg input{background:var(--panel);border:1px solid var(--border);color:#fff;padding:7px 10px;border-radius:8px;font-size:0.7rem;width:200px}
.cfg button{background:var(--blue);color:#fff;border:none;padding:7px 12px;border-radius:8px;font-weight:800;cursor:pointer;font-size:0.7rem}
.cfg button.green{background:var(--accent);color:#000}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px}
.sum{background:linear-gradient(180deg,var(--card),var(--panel));border:1px solid var(--border);border-radius:12px;padding:12px}
.sum-label{font-size:0.55rem;color:var(--muted);letter-spacing:1px}.sum-val{font-size:1.6rem;font-weight:800;margin-top:4px}
.grid{padding:0 14px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}.card.monitor{border:1.5px solid var(--blue);box-shadow:0 0 20px rgba(59,130,246,.15)}
.head{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);font-weight:700}
.flow{padding:16px;text-align:center}.flow-v{font-size:2.6rem;font-weight:800;color:var(--accent)}.badge{padding:4px 10px;border-radius:20px;font-size:0.65rem;font-weight:800}.open{background:rgba(0,229,176,.12);color:var(--accent);border:1px solid var(--accent)}.closed{background:rgba(239,68,68,.12);color:var(--red);border:1px solid var(--red)}
.ctrl{display:flex;gap:8px;padding:10px}.btn{flex:1;padding:10px;border-radius:8px;border:none;font-weight:800;cursor:pointer}.btn-o{background:var(--accent);color:#000}.btn-c{background:transparent;color:var(--red);border:1px solid var(--red)}
.paybox{padding:10px;background:rgba(0,229,176,.05);border-top:1px solid var(--border)}.pay-row{display:flex;gap:6px;margin-top:8px}.pay-input{flex:1;padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:#fff}
.pay-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:800;cursor:pointer}
.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:0.8rem;display:none;z-index:99}
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <div class="logo">AQUASENSE HYBRID</div>
    <div style="font-size:0.65rem;display:flex;gap:10px">
      <span><span id="dotLocal" class="badge-dot"></span> LOCAL</span>
      <span><span id="dotCloud" class="badge-dot"></span> CLOUD MQTT</span>
      <span id="count" style="color:var(--muted)">0 NODES</span>
    </div>
  </div>
  <div class="cfg">
    <input id="localIp" placeholder="Local IP e.g. http://192.168.1.45"/>
    <input id="mqttTopic" placeholder="MQTT topic" value="aquasense/moses_kaaga_9x7p2"/>
    <button class="green" onclick="saveAndConnect()">CONNECT</button>
  </div>
</header>

<div class="summary">
  <div class="sum"><div class="sum-label">MONITOR BULK ID 0</div><div class="sum-val" style="color:var(--blue)" id="mon">0 L</div></div>
  <div class="sum"><div class="sum-label">CUSTOMERS TOTAL</div><div class="sum-val" style="color:var(--accent)" id="cust">0 L</div></div>
  <div class="sum"><div class="sum-label">LOSS</div><div class="sum-val" style="color:var(--red)" id="diff">0 L</div></div>
  <div class="sum"><div class="sum-label">% LOSS</div><div class="sum-val" style="color:var(--yellow)" id="perc">0%</div></div>
</div>

<div class="grid" id="grid"><div class="empty" id="empty">Set Local IP and/or MQTT topic then CONNECT<br><br>Local works at home, MQTT works anywhere in the world.</div></div>
<div id="toast"></div>

<script>
let LOCAL_BASE = localStorage.getItem('AQUA_LOCAL') || '';
let TOPIC_BASE = localStorage.getItem('AQUA_TOPIC') || 'aquasense/moses_kaaga_9x7p2';
let mqttClient=null, localTimer=null;

document.getElementById('localIp').value = LOCAL_BASE;
document.getElementById('mqttTopic').value = TOPIC_BASE;

function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}

function saveAndConnect(){
  LOCAL_BASE=document.getElementById('localIp').value.trim().replace(/\/$/,'');
  TOPIC_BASE=document.getElementById('mqttTopic').value.trim().replace(/\/$/,'');
  localStorage.setItem('AQUA_LOCAL',LOCAL_BASE);
  localStorage.setItem('AQUA_TOPIC',TOPIC_BASE);
  connectLocal(); connectMQTT();
}

function cardHTML(id,isMon){
  let pay=isMon?'':`
    <div class="paybox">
      <div style="font-size:0.7rem">Paid <b id="paid-${id}">0</b> Ksh | Used <b id="used-${id}">0</b> | Rem <b id="rem-${id}" style="color:var(--accent)">0</b> Ksh</div>
      <div class="pay-row"><input class="pay-input" id="in-${id}" type="number" placeholder="Ksh"><button class="pay-btn" onclick="doPay('${id}')">PAY & OPEN</button></div>
    </div>`;
  return `<div class="card ${isMon?'monitor':''}" id="card-${id}"><div class="head"><div>${isMon?'◈ MONITOR BULK ID 0':'◈ CUSTOMER ID '+id}</div><div style="font-size:0.6rem" id="rssi-${id}">--</div></div><div class="flow"><div class="flow-v" id="flow-${id}">0.00</div><div style="font-size:0.65rem;color:var(--muted)">TOTAL <b id="total-${id}">0</b> L | <span class="badge closed" id="valve-${id}">UNKNOWN</span></div></div><div class="ctrl"><button class="btn btn-o" onclick="doValve('${id}','open')">OPEN</button><button class="btn btn-c" onclick="doValve('${id}','close')">CLOSE</button></div>${pay}</div>`;
}
function ensure(id){if(!document.getElementById('card-'+id)){let e=document.getElementById('empty');if(e)e.remove();document.getElementById('grid').insertAdjacentHTML('beforeend',cardHTML(id,id=='0'));}}
function renderData(data, source){
  if(!data || !data.nodes) return;
  if(source==='local') document.getElementById('dotLocal').classList.add('on');
  if(source==='cloud') document.getElementById('dotCloud').classList.add('on');
  if(data.summary){document.getElementById('mon').textContent=data.summary.mon+' L';document.getElementById('cust').textContent=data.summary.cust+' L';document.getElementById('diff').textContent=data.summary.diff+' L';document.getElementById('perc').textContent=data.summary.perc.toFixed(1)+' %';document.getElementById('count').textContent=data.summary.count+' NODES';}
  data.nodes.forEach(n=>{
    ensure(n.id);
    document.getElementById('flow-'+n.id).textContent=parseFloat(n.flow).toFixed(2);
    document.getElementById('total-'+n.id).textContent=n.total;
    let vb=document.getElementById('valve-'+n.id); vb.textContent=n.valve; vb.className='badge '+(n.valve.includes('OPEN')?'open':'closed');
    document.getElementById('rssi-'+n.id).textContent='RSSI '+n.rssi+' | '+source;
    if(n.id!='0'){document.getElementById('paid-'+n.id).textContent=(n.paid||0).toFixed(0);document.getElementById('used-'+n.id).textContent=(n.usedCost||0).toFixed(0);document.getElementById('rem-'+n.id).textContent=(n.remaining||0).toFixed(0);}
  });
}

// --- LOCAL POLLING ---
async function pollLocal(){
  if(!LOCAL_BASE) return;
  try{
    let r=await fetch(LOCAL_BASE+'/data',{headers:{'ngrok-skip-browser-warning':'true'}});
    if(!r.ok) throw 'fail';
    let d=await r.json();
    renderData(d,'local');
  }catch(e){document.getElementById('dotLocal').classList.remove('on');}
}
function connectLocal(){
  if(localTimer) clearInterval(localTimer);
  if(LOCAL_BASE){toast('Connecting Local: '+LOCAL_BASE); pollLocal(); localTimer=setInterval(pollLocal,2000);}
}

// --- MQTT CLOUD ---
function connectMQTT(){
  if(!TOPIC_BASE) return;
  if(mqttClient) mqttClient.end();
  mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{clientId:'aqua_'+Math.random().toString(16).substr(2,8)});
  mqttClient.on('connect',()=>{
    toast('Cloud MQTT Connected: '+TOPIC_BASE);
    document.getElementById('dotCloud').classList.add('on');
    mqttClient.subscribe(TOPIC_BASE+'/live');
  });
  mqttClient.on('message',(topic,msg)=>{
    if(topic.endsWith('/live')){
      try{let data=JSON.parse(msg.toString()); renderData(data,'cloud');}catch(e){}
    }
  });
  mqttClient.on('close',()=>{document.getElementById('dotCloud').classList.remove('on');});
  mqttClient.on('error',()=>{document.getElementById('dotCloud').classList.remove('on');});
}

// --- SEND COMMANDS TO BOTH ---
async function doValve(id,action){
  // 1. Cloud
  if(mqttClient && mqttClient.connected){ mqttClient.publish(TOPIC_BASE+'/cmd', JSON.stringify({node:id,action:action})); }
  // 2. Local
  if(LOCAL_BASE){ try{ await fetch(`${LOCAL_BASE}/valve?node=${id}&action=${action}`,{mode:'no-cors'}); }catch(e){} }
  toast(`Sent ${id}:${action} to Local+Cloud`);
}
async function doPay(id){
  let amt=document.getElementById('in-'+id).value; if(!amt) return alert('Enter amount');
  if(mqttClient && mqttClient.connected){ mqttClient.publish(TOPIC_BASE+'/cmd', JSON.stringify({node:id,amount:parseFloat(amt)})); }
  if(LOCAL_BASE){ try{ await fetch(`${LOCAL_BASE}/pay?node=${id}&amount=${amt}`,{mode:'no-cors'}); }catch(e){} }
  document.getElementById('in-'+id).value=''; toast(`Paid ${amt} Ksh to ID ${id} (Local+Cloud)`);
}

// Auto start
if(LOCAL_BASE || TOPIC_BASE){ connectLocal(); connectMQTT(); }
</script>
</body>
</html>
