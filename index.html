<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AquaSense Distribution System</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--panel:#101828;--card:#121d33;--border:#1e2f52;--accent:#00e5b0;--blue:#3b82f6;--red:#ef4444;--yellow:#f59e0b;--text:#e6edf7;--muted:#7b8ba5;}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
header{position:sticky;top:0;z-index:10;background:rgba(7,11,20,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-family:'JetBrains Mono';font-weight:800;letter-spacing:1px;color:var(--accent);font-size:1.1rem}
.config{display:flex;gap:8px;align-items:center}
.config input{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:'JetBrains Mono';font-size:0.75rem;width:320px;max-width:60vw}
.config button{background:var(--accent);color:#000;border:none;padding:8px 14px;border-radius:8px;font-weight:800;cursor:pointer}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:0 0 8px var(--red)}
.status-dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:18px 20px}
.sum{background:linear-gradient(180deg,var(--card),var(--panel));border:1px solid var(--border);border-radius:14px;padding:14px}
.sum-label{font-size:0.6rem;color:var(--muted);letter-spacing:1.2px;font-family:'JetBrains Mono'} 
.sum-val{font-size:1.8rem;font-weight:800;margin-top:6px;font-family:'JetBrains Mono'}
.grid{padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:0.2s}
.card.monitor{border:1.5px solid var(--blue);box-shadow:0 0 30px rgba(59,130,246,0.15)}
.card-head{display:flex;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border)}
.id{font-family:'JetBrains Mono';font-weight:700;color:var(--accent)} .monitor .id{color:var(--blue)}
.rssi{font-size:0.6rem;background:var(--panel);border:1px solid var(--border);padding:3px 8px;border-radius:20px;color:var(--muted);font-family:'JetBrains Mono'}
.flow{padding:20px;text-align:center;border-bottom:1px solid var(--border)}
.flow-v{font-family:'JetBrains Mono';font-size:3rem;font-weight:800;color:var(--accent);line-height:1}
.badge{padding:5px 12px;border-radius:20px;font-size:0.65rem;font-weight:800;letter-spacing:1px}
.open{background:rgba(0,229,176,0.12);color:var(--accent);border:1px solid var(--accent)}
.closed{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid var(--red)}
.ctrl{display:flex;gap:8px;padding:12px}
.btn{flex:1;padding:11px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:0.8rem;letter-spacing:0.5px}
.btn-o{background:var(--accent);color:#000} .btn-c{background:transparent;color:var(--red);border:1px solid var(--red)}
.paybox{padding:12px;background:rgba(0,229,176,0.05);border-top:1px solid var(--border)}
.bill{font-size:0.72rem;line-height:1.7;color:var(--muted);font-family:'JetBrains Mono'} .bill b{color:var(--text)}
.pay-row{display:flex;gap:6px;margin-top:10px}
.pay-input{flex:1;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono'}
.pay-btn{padding:10px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer}
.empty{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;font-family:'JetBrains Mono'}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:0.8rem;display:none;z-index:99}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px"><span id="dot" class="status-dot"></span><div class="logo">AQUASENSE CLOUD</div><span style="font-size:0.6rem;color:var(--muted);font-family:'JetBrains Mono'" id="nodeCount">0 NODES</span></div>
  <div class="config">
    <input id="baseUrl" placeholder="http://192.168.1.XX  or  https://xxxx.ngrok-free.app"/>
    <button onclick="saveBase()">CONNECT</button>
  </div>
</header>

<div class="summary">
  <div class="sum"><div class="sum-label">MONITOR BULK (ID 0)</div><div class="sum-val" style="color:var(--blue)" id="monTotal">0 L</div></div>
  <div class="sum"><div class="sum-label">CUSTOMERS TOTAL</div><div class="sum-val" style="color:var(--accent)" id="custTotal">0 L</div></div>
  <div class="sum"><div class="sum-label">LOSS / LEAKAGE</div><div class="sum-val" style="color:var(--red)" id="diff">0 L</div></div>
  <div class="sum"><div class="sum-label">% LOSS</div><div class="sum-val" style="color:var(--yellow)" id="perc">0%</div></div>
</div>

<div class="grid" id="grid"><div class="empty" id="empty">Set Master IP / Ngrok URL on top and click CONNECT<br><br>Example local: http://192.168.4.1<br>Example public: https://abc123.ngrok-free.app</div></div>
<div id="toast"></div>

<script>
let BASE = localStorage.getItem('AQUA_BASE') || '';
let timer = null;
document.getElementById('baseUrl').value = BASE;

function saveBase(){
  let v = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
  if(!v){alert('Enter Master URL');return;}
  BASE = v; localStorage.setItem('AQUA_BASE', BASE);
  toast('Connecting to '+BASE);
  startPoll();
}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}

function cardHTML(id,isMon){
  let payBox = isMon ? '' : `
    <div class="paybox">
      <div class="bill">Paid: <b id="paid-${id}">0</b> Ksh | Used: <b id="used-${id}">0</b> Ksh<br>Remain: <b id="rem-${id}" style="color:var(--accent)">0</b> Ksh | Vol: <b id="tused-${id}">0</b> L</div>
      <div class="pay-row"><input class="pay-input" id="payIn-${id}" type="number" placeholder="Ksh amount"><button class="pay-btn" onclick="pay('${id}')">PAY & OPEN</button></div>
    </div>`;
  return `<div class="card ${isMon?'monitor':''}" id="card-${id}"><div class="card-head"><div class="id">${isMon?'◈ MONITOR BULK ID 0':'◈ CUSTOMER ID '+id}</div><div class="rssi" id="rssi-${id}">--</div></div><div class="flow"><div class="flow-v" id="flow-${id}">0.00</div><div style="font-size:0.65rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono'">L/min | TOTAL <b id="total-${id}">0</b> L</div></div><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);"><span style="font-size:0.6rem;color:var(--muted);letter-spacing:1px">VALVE</span><span class="badge closed" id="valve-${id}">UNKNOWN</span></div><div class="ctrl"><button class="btn btn-o" onclick="sendV('${id}','open')">OPEN</button><button class="btn btn-c" onclick="sendV('${id}','close')">CLOSE</button></div>${payBox}</div>`;
}
function ensure(id){if(!document.getElementById('card-'+id)){let e=document.getElementById('empty');if(e)e.remove();document.getElementById('grid').insertAdjacentHTML('beforeend',cardHTML(id,id=='0'));}}
function update(o){
  ensure(o.id);
  document.getElementById('flow-'+o.id).textContent=parseFloat(o.flow).toFixed(2);
  document.getElementById('total-'+o.id).textContent=o.total;
  let vb=document.getElementById('valve-'+o.id);vb.textContent=o.valve;vb.className='badge '+(o.valve.includes('OPEN')?'open':'closed');
  document.getElementById('rssi-'+o.id).textContent='RSSI '+o.rssi+' dBm';
  if(o.id!='0'){document.getElementById('paid-'+o.id).textContent=(o.paid||0).toFixed(0);document.getElementById('used-'+o.id).textContent=(o.usedCost||0).toFixed(0);document.getElementById('rem-'+o.id).textContent=(o.remaining||0).toFixed(0);document.getElementById('tused-'+o.id).textContent=o.total;}
}
function updateSummary(s){
  document.getElementById('monTotal').textContent=s.mon+' L';
  document.getElementById('custTotal').textContent=s.cust+' L';
  document.getElementById('diff').textContent=s.diff+' L';
  document.getElementById('perc').textContent=s.perc.toFixed(1)+' %';
  document.getElementById('nodeCount').textContent=s.count+' NODES';
  if(s.perc>15) document.getElementById('perc').style.color='var(--red)';
}

async function api(path){
  if(!BASE) throw 'No base';
  let url = BASE + path;
  // ngrok needs header to skip warning
  let res = await fetch(url, {headers:{'ngrok-skip-browser-warning':'true'}});
  if(!res.ok) throw res.status;
  return res;
}

async function poll(){
  try{
    let r = await api('/data');
    let d = await r.json();
    document.getElementById('dot').classList.add('on');
    d.nodes.forEach(update);
    updateSummary(d.summary);
  }catch(e){
    document.getElementById('dot').classList.remove('on');
    console.log('poll err',e);
  }
}
async function sendV(id,act){
  try{await api(`/valve?node=${id}&action=${act}`);toast(`Sent ${id}:${act}`);}catch{toast('Failed - check CORS & URL');}
}
async function pay(id){
  let amt=document.getElementById('payIn-'+id).value;
  if(!amt||amt<=0){alert('Enter amount');return;}
  try{let r=await api(`/pay?node=${id}&amount=${amt}`);let t=await r.text();toast(t);document.getElementById('payIn-'+id).value='';}catch{toast('Pay failed');}
}
function startPoll(){
  if(timer) clearInterval(timer);
  poll(); timer=setInterval(poll,1800);
}
if(BASE) startPoll();
</script>
</body>
</html>
